<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
<head>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Epilogue:wght@500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#ffffff",
            background: "#ffffff",
            "surface-subtle": "#fafafa",
            "surface-border": "#e5e5e5",
            "surface-card": "#ffffff",
            primary: "#000000",
            "on-surface": "#000000",
            "on-surface-muted": "#525252",
            "on-surface-subtle": "#737373",

  <style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #ffffff;
        color: #000000;
      }
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #fafafa;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4d4d4;
      border-radius: 9999px;
    }

              <a class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-neutral-100 hover:bg-neutral-200 text-black border border-neutral-200 text-xs font-semibold tracking-wider uppercase transition-colors" href="https://github.com/Brianju1205/pract1" target="_blank" rel="noopener noreferrer">

              <div class="w-10 h-10 rounded-xl bg-neutral-100 border border-neutral-200 flex items-center justify-center text-black transition-colors group-hover:bg-black group-hover:text-white group-hover:border-black">
