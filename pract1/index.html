<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNACH </title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <header>
        <div class="imagen-edificio">
            <img src="escuela.jpg">
        </div>
        
        <div class="titulo-unach">
            <h1>Universidad Autónoma de Chiapas</h1>
            <p>"Por la conciencia de la necesidad de servir"</p>
        </div>
        
        <div class="logo-unach">
            <img src="logo unach.png">
        </div>
    </header>
    <nav>
    </nav>
    <div class="contenedor-principal">
        
        <main>
            <form id="formulario-api">
                <div class="campo">
                    <label for="id">Id:</label>
                    <input type="text" id="id" placeholder="Num Id">
                    <button type="button" id="btn1">Consultar</button>
                </div>
                <div class="campo">
                    <label for="nom">Nombre:</label>
                    <input type="text" id="nom" placeholder="Nombre">
                </div>
                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="text" id="email" placeholder="Email">
                </div>
            </form>
        </main>
        <aside>
            <form id="formulario-tarea">
                <div class="campo">
                    <label for="num1">Numero 1:</label>
                    <input type="text" id="num1" placeholder="numero">
                </div>
                
                <div class="campo">
                    <label for="num2">Numero 2:</label>
                    <input type="text" id="num2" placeholder="numero">
                </div>
                <div class="campo">
                    <label for="operacion">Operacion</label>
                    <select id="operacion">
                        <option value="multiplicacion">multiplicacion</option>
                        <option value="suma">suma</option>
                        <option value="resta">resta</option>
                        <option value="division">division</option>
                    </select>
                </div>
                <button type="button" id="btn-ejecutar">Ejecutar</button>
                <div class="campo">
                    <label for="resultado">Resultado:</label>
                    <input type="text" id="resultado" readonly>
                </div>
            </form>
        </aside>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
